name: Publish browser version

# Builds web/dist (the in-browser De-Identifier: a static site, no server code) and
# publishes it to GitHub Pages on every push to main that touches the app.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "deid/**", "tools/build_web.py", "assets/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python tools/build_web.py
      - uses: actions/upload-pages-artifact@v3
        with: {path: web/dist}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
